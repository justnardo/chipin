name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Each gate is its own step so a red run names the thing that broke.
      - name: Typecheck
        run: npm run check

      - name: Lint and format
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also exercises scripts/sync_ocr_assets.mjs via prebuild. static/ocr is
      # gitignored, so this is the only place we find out the OCR engine still
      # copies out of node_modules before a deploy depends on it.
      - name: Build
        run: npm run build

      - name: Confirm OCR assets were produced
        run: |
          missing=0
          for f in worker.min.js eng.traineddata.gz \
                   tesseract-core-relaxedsimd-lstm.wasm \
                   tesseract-core-simd-lstm.wasm \
                   tesseract-core-lstm.wasm; do
            if [ ! -s "static/ocr/$f" ]; then
              echo "::error::static/ocr/$f is missing or empty after build"
              missing=1
            fi
          done
          exit $missing
